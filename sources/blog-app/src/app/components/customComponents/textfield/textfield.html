<div class="form-group mb-3">
  <label class="form-label mb-1 fs-6" for="{{ label.toLowerCase() }}" i18n>{{ label }}</label>
  <input
    #inputRef
    class="form-control custom-textfield {{ className }}"
    [placeholder]="placeHolder.toString()"
    [type]="type === 'date' ? 'text' : type"
    [id]="label.toLowerCase()"
    [name]="label.toLowerCase()"
    [required]="required"
    [disabled]="disabled"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />
</div>
