<div class="container-fluid d-flex flex-column h-100 px-3 px-md-4 py-3">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-light" data-bs-theme="light">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/">{{ title() }}</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              >{{ labels.navBlogs }}</a
            >
          </li>
          @if (authService.currentUserSignal() != null) {
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="currentUserDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-haspopup="menu"
                aria-expanded="false"
              >
                {{ authService.currentUserSignal()?.email }}
              </a>
              <div class="dropdown-menu dropdown-menu-end" aria-labelledby="currentUserDropdown">
                <a class="dropdown-item" routerLink="profile" routerLinkActive="active">{{
                  labels.navProfile
                }}</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" routerLink="signin" routerLinkActive="active">
                  {{ labels.labelMyBlogs }}
                </a>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item" type="button" (click)="authService.signOut()">
                  {{ labels.navSignOut }}
                </button>
              </div>
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENT (this grows) -->
  <div
    class="container-fluid flex-grow-1 d-flex flex-column mt-3 rounded px-2 px-md-4 py-3 overflow-hidden bg-light"
  >
    <app-loading-spinner></app-loading-spinner>
    <router-outlet></router-outlet>
  </div>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
